<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChipCost - 芯片成本查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .container {
    width: 100%;
    max-width: 800px;
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    height: fit-content;
  }
  h1 { font-size: 26px; text-align: center; margin-bottom: 8px; color: #2c3e50; }
  .subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }
  .search-box { display: flex; gap: 12px; }
  input {
    flex: 1; padding: 14px 20px; font-size: 16px;
    border: 2px solid #e0e6ed; border-radius: 12px; outline: none;
    transition: border-color 0.3s;
  }
  input:focus { border-color: #3498db; }
  button {
    padding: 14px 32px; font-size: 16px; background: #3498db; color: #fff;
    border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
    transition: background 0.3s;
  }
  button:hover { background: #2980b9; }
  button:disabled { background: #bdc3c7; cursor: not-allowed; }
  #result { margin-top: 30px; }
  .loading { text-align: center; color: #7f8c8d; padding: 30px; }
  .error { color: #e74c3c; background: #fdf0ed; padding: 20px; border-radius: 12px; border-left: 4px solid #e74c3c; }

  .should-cost-card {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 16px; padding: 28px; text-align: center; color: #fff; margin-bottom: 24px;
  }
  .should-cost-label { font-size: 14px; opacity: 0.85; margin-bottom: 8px; letter-spacing: 1px; }
  .should-cost-value { font-size: 48px; font-weight: 800; margin-bottom: 4px; }
  .should-cost-note { font-size: 13px; opacity: 0.8; }

  .info-card {
    border: 1px solid #e0e6ed; border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }
  .info-title { font-size: 16px; font-weight: 700; color: #2c3e50; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #f1f4f8; }
  .info-row { display: flex; padding: 8px 0; font-size: 14px; }
  .info-label { color: #7f8c8d; min-width: 110px; flex-shrink: 0; }
  .info-value { color: #2c3e50; font-weight: 500; }

  .source-section { border: 1px solid #e0e6ed; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .source-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .source-name { font-size: 16px; font-weight: 700; color: #2c3e50; }
  .source-badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #ecf0f1; color: #7f8c8d; }
  .source-price { font-size: 18px; font-weight: 700; color: #e74c3c; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f1f4f8; font-size: 13px; }
  th { background: #f8f9fa; color: #7f8c8d; font-weight: 500; }
  .detail-link { display: block; text-align: center; margin-top: 14px; color: #3498db; text-decoration: none; font-size: 13px; }
  .detail-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>ChipCost 芯片成本查询</h1>
  <p class="subtitle">输入芯片型号，获取 AI 分类后的推荐成本</p>
  <div class="search-box">
    <input type="text" id="partInput" placeholder="例如：STM32F103C8T6" />
    <button id="queryBtn" onclick="query()">查询</button>
  </div>
  <div id="result"></div>
</div>

<script>
const API_URL = 'https://chipcost.space';

document.getElementById('partInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') query();
});

async function query() {
  const input = document.getElementById('partInput');
  const btn = document.getElementById('queryBtn');
  const resultDiv = document.getElementById('result');
  const partNumber = input.value.trim();

  if (!partNumber) {
    resultDiv.innerHTML = '<div class="error">请输入芯片型号</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = '查询中...';
  resultDiv.innerHTML = '<div class="loading">正在查询价格并调用 AI 分类...</div>';

  try {
    const resp = await fetch(API_URL + '?partNumber=' + encodeURIComponent(partNumber));
    const data = await resp.json();

    if (!resp.ok) {
      resultDiv.innerHTML = '<div class="error">' + (data.error || '查询失败') + '</div>';
      return;
    }

    let html = '';

    // Should Cost 卡片
    if (data.shouldCost) {
      html += '<div class="should-cost-card">';
      html += '<div class="should-cost-label">SHOULD COST</div>';
      html += '<div class="should-cost-value">$' + data.shouldCost + '</div>';
      html += '<div class="should-cost-note">基于 1000pcs 参考价 × 分类系数</div>';
      html += '</div>';
    }

    // 芯片信息
    html += '<div class="info-card">';
    html += '<div class="info-title">芯片信息</div>';
    html += '<div class="info-row"><span class="info-label">厂商料号</span><span class="info-value">' + (data.partNumber || '-') + '</span></div>';
    html += '<div class="info-row"><span class="info-label">制造商</span><span class="info-value">' + (data.manufacturer || '-') + '</span></div>';
    html += '<div class="info-row"><span class="info-label">芯片一级分类</span><span class="info-value">' + (data.level1 || '-') + '</span></div>';
    html += '<div class="info-row"><span class="info-label">芯片二级分类</span><span class="info-value">' + (data.level2 || '-') + '</span></div>';
    html += '<div class="info-row"><span class="info-label">描述</span><span class="info-value">' + (data.description || '-') + '</span></div>';
    html += '</div>';

    // 贸泽价格阶梯
    if (data.priceBreaks && data.priceBreaks.length > 0) {
      html += '<div class="source-section">';
      html += '<div class="source-header"><span class="source-name">贸泽 Mouser</span><span class="source-badge">参考价</span></div>';
      if (data.price1k) {
        html += '<div class="source-price">1000pcs: $' + data.price1k + '</div>';
      }
      html += '<table><tr><th>起订量</th><th>单价</th></tr>';
      data.priceBreaks.forEach(pb => {
        html += '<tr><td>' + pb.Quantity + '</td><td>' + pb.Price + '</td></tr>';
      });
      html += '</table>';
      if (data.detailUrl) {
        html += '<a class="detail-link" href="' + data.detailUrl + '" target="_blank">查看贸泽详情页 →</a>';
      }
      html += '</div>';
    }

    resultDiv.innerHTML = html;

  } catch (e) {
    resultDiv.innerHTML = '<div class="error">无法连接到后端服务，请稍后重试</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = '查询';
  }
}
</script>
</body>
</html>
