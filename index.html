<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230054A6'/%3E%3Ctext x='50' y='74' font-size='68' font-family='Microsoft YaHei,sans-serif' text-anchor='middle' fill='white' font-weight='bold'%3E%E8%8A%AF%3C/text%3E%3C/svg%3E">
<title>ChipCost - 芯片成本</title>
<script src="https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; padding: 80px 16px 40px; }
  .container { width: 100%; max-width: 800px; background: #fff; border-radius: 16px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); height: fit-content; }
  h1 { font-size: 26px; text-align: center; margin-bottom: 8px; color: #2c3e50; }
  .subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }
  .search-box { display: flex; gap: 12px; margin-bottom: 20px; }
  .search-input-wrapper { position: relative; flex: 1; display: flex; align-items: center; }
  input[type="text"] { flex: 1; padding: 14px 20px; font-size: 16px; border: 2px solid #e0e6ed; border-radius: 12px; outline: none; transition: border-color 0.3s; width: 100%; }
  .search-input-wrapper input[type="text"] { padding-right: 40px; }
  input[type="text"]:focus { border-color: #3498db; }
  .clear-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 22px; color: #bdc3c7; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; line-height: 1; border-radius: 50%; transition: all 0.2s; user-select: none; }
  .clear-icon:hover { color: #e74c3c; background-color: #fdf0ed; }
  button { padding: 14px 32px; font-size: 16px; background: #3498db; color: #fff; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: background 0.3s; white-space: nowrap; }
  button:hover { background: #2980b9; }
  button:disabled { background: #bdc3c7; cursor: not-allowed; }
  .batch-btn { background: #27ae60; padding: 14px 32px; font-size: 16px; }
  .batch-btn:hover { background: #219150; }
  #result { margin-top: 30px; }
  .loading { text-align: center; color: #7f8c8d; padding: 30px; }
  .error { color: #e74c3c; background: #fdf0ed; padding: 20px; border-radius: 12px; border-left: 4px solid #e74c3c; }
  .should-cost-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px; padding: 32px; text-align: center; color: #fff; margin-bottom: 24px; }
  .should-cost-label { font-size: 22px; font-weight: 700; opacity: 0.95; margin-bottom: 12px; letter-spacing: 1.5px; }
  .should-cost-value { font-size: 52px; font-weight: 800; margin-bottom: 6px; line-height: 1.1; }
  .should-cost-tax { font-size: 12px; opacity: 0.75; margin-top: 4px; }
  .info-card { border: 1px solid #e0e6ed; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .info-title { font-size: 16px; font-weight: 700; color: #2c3e50; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #f1f4f8; }
  .info-row { display: flex; padding: 8px 0; font-size: 14px; }
  .info-label { color: #7f8c8d; min-width: 110px; flex-shrink: 0; }
  .info-value { color: #2c3e50; font-weight: 500; }
  .pn-match { color: #27ae60; font-weight: bold; }
  .pn-mismatch { color: #e74c3c; font-weight: bold; }
  .source-section { border: 1px solid #e0e6ed; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .source-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .source-name { font-size: 16px; font-weight: 700; color: #2c3e50; }
  .source-badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #ecf0f1; color: #7f8c8d; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f1f4f8; font-size: 13px; }
  th { background: #f8f9fa; color: #7f8c8d; font-weight: 500; }
  .detail-link { display: block; text-align: center; margin-top: 14px; color: #3498db; text-decoration: none; font-size: 13px; }
  .detail-link:hover { text-decoration: underline; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 32px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 22px; color: #2c3e50; margin-bottom: 16px; text-align: center; }
  .notice { background: #fff9e6; border-left: 4px solid #f39c12; padding: 14px 18px; border-radius: 8px; font-size: 13px; color: #7f5f00; line-height: 1.7; margin-bottom: 20px; }
  .notice strong { color: #d35400; }
  .drop-zone { border: 2px dashed #bdc3c7; border-radius: 12px; padding: 40px 20px; text-align: center; color: #7f8c8d; cursor: pointer; transition: all 0.3s; margin-bottom: 20px; background: #fafbfc; }
  .drop-zone:hover, .drop-zone.dragover { border-color: #3498db; background: #f0f7ff; color: #3498db; }
  .drop-zone-icon { font-size: 42px; margin-bottom: 10px; }
  .drop-zone-text { font-size: 15px; margin-bottom: 6px; }
  .drop-zone-hint { font-size: 12px; color: #95a5a6; }
  .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; }
  .progress-container { border: 1px solid #e0e6ed; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .progress-title { font-size: 16px; font-weight: 700; color: #2c3e50; margin-bottom: 12px; }
  .progress-tip { background: #eaf6ff; border-left: 4px solid #3498db; padding: 12px 16px; border-radius: 8px; font-size: 13px; color: #2c5282; line-height: 1.7; margin-bottom: 16px; }
  .progress-bar-bg { background: #ecf0f1; border-radius: 10px; height: 20px; overflow: hidden; margin-bottom: 12px; }
  .progress-bar-fill { background: linear-gradient(90deg, #3498db, #2ecc71); height: 100%; width: 0%; transition: width 0.3s; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: bold; }
  .progress-text { font-size: 13px; color: #7f8c8d; text-align: center; }
  .progress-current { font-size: 12px; color: #95a5a6; text-align: center; margin-top: 8px; word-break: break-all; }
  .success-msg { background: #d4edda; border-left: 4px solid #27ae60; padding: 16px; border-radius: 8px; color: #155724; font-size: 14px; margin-bottom: 16px; }
  @media (max-width: 600px) { body { padding: 30px 12px 20px; } .container { padding: 24px; } h1 { font-size: 22px; } .search-box { flex-direction: column; } .search-input-wrapper { width: 100%; } .search-box input[type="text"], .search-box button { width: 100%; } .should-cost-value { font-size: 40px; } .should-cost-label { font-size: 18px; } }
</style>
</head>
<body>
<div class="container">
  <h1>ChipCost 芯片成本</h1>
  <p class="subtitle">输入芯片型号，获取 AI 分析后的推荐成本</p>

  <div class="search-box">
    <div class="search-input-wrapper">
      <input type="text" id="partInput" placeholder="例如：STM32F103C8T6" oninput="toggleClearBtn()" />
      <span id="clearInputBtn" class="clear-icon" onclick="clearInput()" style="display: none;">&times;</span>
    </div>
    <button id="queryBtn" onclick="query()">单件查询</button>
    <button class="batch-btn" onclick="openBatchModal()">批量分析</button>
  </div>

  <div id="result"></div>
</div>

<div class="modal-overlay" id="batchModal">
  <div class="modal">
    <h2>批量分析 BOM 文件</h2>
    <div class="notice">
      <strong>📋 使用说明：</strong><br>
      1. 文件格式：仅支持 <strong>Excel (.xlsx / .xls)</strong> 或 <strong>WPS 表格</strong>；<br>
      2. 上传文件的 <strong>第 1 行为表头</strong>，芯片型号位于 <strong>A 列</strong>、<strong>第 2 行起</strong>；<br>
      3. 受 API 调用次数及时间间隔限制，批量分析的芯片数量<strong>上限暂设定为 100 个</strong>，超出部分不予分析，开发者将依据后续使用情况调整限额。
    </div>
    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-icon">📁</div>
      <div class="drop-zone-text">点击此处选择文件，或将文件拖拽到此处</div>
      <div class="drop-zone-hint">支持 .xlsx / .xls 格式</div>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" />
    </div>
    <div class="modal-buttons">
      <button style="background:#95a5a6;" onclick="closeBatchModal()">取消</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://chipcost.space';
const MAX_BATCH = 100;
const QUERY_INTERVAL_MS = 1500;

function toggleClearBtn() {
  const input = document.getElementById('partInput');
  const clearBtn = document.getElementById('clearInputBtn');
  if (input.value.length > 0) {
    clearBtn.style.display = 'flex';
  } else {
    clearBtn.style.display = 'none';
  }
}

function clearInput() {
  const input = document.getElementById('partInput');
  const clearBtn = document.getElementById('clearInputBtn');
  input.value = '';
  clearBtn.style.display = 'none';
  input.focus();
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatPartNumber(displayPn, searchPn) {
  if (!displayPn) return '-';
  const a = String(displayPn).trim().toLowerCase();
  const b = String(searchPn || '').trim().toLowerCase();
  if (a === b) {
    return '<span class="pn-match">' + escapeHtml(displayPn) + '</span>';
  } else {
    return '<span class="pn-mismatch">' + escapeHtml(displayPn) + '（型号未完全匹配，注意甄别）</span>';
  }
}

document.getElementById('partInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') query();
});

async function query() {
  const input = document.getElementById('partInput');
  const btn = document.getElementById('queryBtn');
  const resultDiv = document.getElementById('result');
  const partNumber = input.value.trim();

  if (!partNumber) {
    resultDiv.innerHTML = '<div class="error">请输入芯片型号</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = '分析中...';
  resultDiv.innerHTML = '<div class="loading">正在查询价格并调用 AI 分析...</div>';

  try {
    const resp = await fetch(API_URL + '?partNumber=' + encodeURIComponent(partNumber));
    const data = await resp.json();

    if (!resp.ok) {
      resultDiv.innerHTML = '<div class="error">' + (data.error || '查询失败') + '</div>';
      return;
    }

    if (!data.shouldCost) {
      resultDiv.innerHTML = '<div class="error">抱歉，未检索到任何价格信息。</div>';
      return;
    }

    let html = '';

    html += '<div class="should-cost-card">';
    html += '<div class="should-cost-label">SHOULD COST 推荐值</div>';
    html += '<div class="should-cost-value">' + data.shouldCost + ' CNY</div>';
    html += '<div class="should-cost-tax">（不含税）</div>';
    html += '</div>';

    html += '<div class="info-card">';
    html += '<div class="info-title">芯片信息</div>';
    html += '<div class="info-row"><span class="info-label">用户输入型号</span><span class="info-value">' + escapeHtml(partNumber) + '</span></div>';
    html += '<div class="info-row"><span class="info-label">芯片一级分类</span><span class="info-value">' + escapeHtml(data.level1 || '-') + '</span></div>';
    html += '<div class="info-row"><span class="info-label">芯片二级分类</span><span class="info-value">' + escapeHtml(data.level2 || '-') + '</span></div>';
    html += '</div>';

    if (data.digikey && data.digikey.priceBreaks && data.digikey.priceBreaks.length > 0) {
      html += '<div class="source-section">';
      html += '<div class="source-header"><span class="source-name">得捷 DigiKey</span><span class="source-badge">' + escapeHtml(data.digikey.error || '参考价') + '</span></div>';
      if (data.digikey.partNumber) {
        html += '<div class="info-row"><span class="info-label">厂商料号</span><span class="info-value">' + formatPartNumber(data.digikey.partNumber, partNumber) + '</span></div>';
      }
      if (data.digikey.manufacturer) {
        html += '<div class="info-row"><span class="info-label">制造商</span><span class="info-value">' + escapeHtml(data.digikey.manufacturer) + '</span></div>';
      }
      if (data.digikey.description) {
        html += '<div class="info-row"><span class="info-label">描述</span><span class="info-value">' + escapeHtml(data.digikey.description) + '</span></div>';
      }
      html += '<table><tr><th>起订量</th><th>单价</th></tr>';
      data.digikey.priceBreaks.forEach(pb => {
        html += '<tr><td>' + escapeHtml(pb.Quantity) + '</td><td>' + escapeHtml(pb.Price) + '</td></tr>';
      });
      html += '</table>';
      if (data.digikey.detailUrl) {
        html += '<a class="detail-link" href="' + escapeHtml(data.digikey.detailUrl) + '" target="_blank">查看得捷详情页 →</a>';
      }
      html += '</div>';
    }

    if (data.mouser && data.mouser.priceBreaks && data.mouser.priceBreaks.length > 0) {
      html += '<div class="source-section">';
      html += '<div class="source-header"><span class="source-name">贸泽 Mouser</span><span class="source-badge">' + escapeHtml(data.mouser.error || '参考价') + '</span></div>';
      if (data.mouser.partNumber) {
        html += '<div class="info-row"><span class="info-label">厂商料号</span><span class="info-value">' + formatPartNumber(data.mouser.partNumber, partNumber) + '</span></div>';
      }
      if (data.mouser.manufacturer) {
        html += '<div class="info-row"><span class="info-label">制造商</span><span class="info-value">' + escapeHtml(data.mouser.manufacturer) + '</span></div>';
      }
      if (data.mouser.description) {
        html += '<div class="info-row"><span class="info-label">描述</span><span class="info-value">' + escapeHtml(data.mouser.description) + '</span></div>';
      }
      html += '<table><tr><th>起订量</th><th>单价</th></tr>';
      data.mouser.priceBreaks.forEach(pb => {
        html += '<tr><td>' + escapeHtml(pb.Quantity) + '</td><td>' + escapeHtml(pb.Price) + '</td></tr>';
      });
      html += '</table>';
      if (data.mouser.detailUrl) {
        html += '<a class="detail-link" href="' + escapeHtml(data.mouser.detailUrl) + '" target="_blank">查看贸泽详情页 →</a>';
      }
      html += '</div>';
    }

    if (data.lcsc && data.lcsc.priceBreaks && data.lcsc.priceBreaks.length > 0) {
      html += '<div class="source-section">';
      html += '<div class="source-header"><span class="source-name">立创商城 LCSC</span><span class="source-badge">' + escapeHtml(data.lcsc.error || '参考价') + '</span></div>';
      if (data.lcsc.productCode) {
        html += '<div class="info-row"><span class="info-label">LCSC编号</span><span class="info-value">' + escapeHtml(data.lcsc.productCode) + '</span></div>';
      }
      if (data.lcsc.productModel) {
        html += '<div class="info-row"><span class="info-label">厂商型号</span><span class="info-value">' + formatPartNumber(data.lcsc.productModel, partNumber) + '</span></div>';
      }
      if (data.lcsc.brandName) {
        html += '<div class="info-row"><span class="info-label">品牌</span><span class="info-value">' + escapeHtml(data.lcsc.brandName) + '</span></div>';
      }
      html += '<table><tr><th>起订量</th><th>单价 (USD)</th></tr>';
      data.lcsc.priceBreaks.forEach(pb => {
        html += '<tr><td>' + escapeHtml(pb.ladder) + '</td><td>$' + (pb.usdPrice ? pb.usdPrice.toFixed(4) : '-') + '</td></tr>';
      });
      html += '</table>';
      if (data.lcsc.pdfUrl) {
        html += '<a class="detail-link" href="' + escapeHtml(data.lcsc.pdfUrl) + '" target="_blank">查看数据手册 →</a>';
      }
      html += '</div>';
    }

    resultDiv.innerHTML = html;

  } catch (e) {
    resultDiv.innerHTML = '<div class="error">无法连接到后端服务，请稍后重试</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = '单件查询';
  }
}

// ========== 批量分析 ==========
function openBatchModal() { document.getElementById('batchModal').classList.add('show'); }
function closeBatchModal() { document.getElementById('batchModal').classList.remove('show'); }

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length > 0) handleFile(e.target.files[0]);
});

async function handleFile(file) {
  const name = file.name.toLowerCase();
  if (!name.endsWith('.xlsx') && !name.endsWith('.xls')) {
    alert('请上传 Excel (.xlsx / .xls) 格式的文件');
    return;
  }

  closeBatchModal();
  const resultDiv = document.getElementById('result');

  let workbook;
  try {
    const arrayBuffer = await file.arrayBuffer();
    workbook = XLSX.read(arrayBuffer, { type: 'array' });
  } catch (e) {
    resultDiv.innerHTML = '<div class="error">文件解析失败，请确认是有效的 Excel 文件</div>';
    return;
  }

  const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });

  if (rows.length < 2) {
    resultDiv.innerHTML = '<div class="error">文件中没有找到数据（第2行开始才是芯片型号）</div>';
    return;
  }

  const partNumbers = [];
  for (let i = 1; i < rows.length; i++) {
    const val = (rows[i][0] || '').toString().trim();
    if (val) partNumbers.push(val);
  }

  if (partNumbers.length === 0) {
    resultDiv.innerHTML = '<div class="error">A列第2行开始未找到任何芯片型号</div>';
    return;
  }

  const total = Math.min(partNumbers.length, MAX_BATCH);
  const truncated = partNumbers.length > MAX_BATCH;
  const list = partNumbers.slice(0, total);

  resultDiv.innerHTML = `
    <div class="progress-container">
      <div class="progress-title">批量分析进行中</div>
      <div class="progress-tip">
        💡 <strong>温馨提示：</strong>批量分析需要为每个芯片型号依次调用芯片网站与AI 接口，为保证 API 稳定性，每个型号之间有约 1.5 秒的时间间隔。整个过程可能需要数分钟，请耐心等待，不要关闭或刷新页面。
        ${truncated ? '<br><br>⚠️ 文件中共有 ' + partNumbers.length + ' 个型号，超出单次上限，本次仅分析前 ' + MAX_BATCH + ' 个。' : ''}
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%">0%</div>
      </div>
      <div class="progress-text" id="progressText">准备中...</div>
      <div class="progress-current" id="progressCurrent"></div>
    </div>
  `;

  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const progressCurrent = document.getElementById('progressCurrent');

  const results = [];

  for (let i = 0; i < list.length; i++) {
    const pn = list[i];
    progressText.textContent = `正在分析 ${i + 1} / ${total}`;
    progressCurrent.textContent = `当前型号：${pn}`;

    try {
      const resp = await fetch(API_URL + '?partNumber=' + encodeURIComponent(pn));
      const data = await resp.json();

      // ====== 核心修改区：提取完整的型号和价格 ======
      const digikeyPrice1k = (data.digikey && data.digikey.price1k) ? '$' + data.digikey.price1k : '未查询到';
      const mouserPrice1k = (data.mouser && data.mouser.price1k) ? '$' + data.mouser.price1k : '未查询到';
      const lcscPrice1k = (data.lcsc && data.lcsc.price1k) ? '$' + data.lcsc.price1k : '未查询到';

      results.push({
        original: pn,
        shouldCost: data.shouldCost || '',
        // 提取各家的完整型号
        digikeyPart: (data.digikey && data.digikey.partNumber) ? data.digikey.partNumber : '未查询到',
        digikey1k: digikeyPrice1k,
        mouserPart: (data.mouser && data.mouser.partNumber) ? data.mouser.partNumber : '未查询到',
        mouser1k: mouserPrice1k,
        lcscPart: (data.lcsc && data.lcsc.productModel) ? data.lcsc.productModel : '未查询到',
        lcsc1k: lcscPrice1k,
        // 后面继续保留原有的品牌、分类、描述
        manufacturer: (data.digikey && data.digikey.manufacturer) || (data.mouser && data.mouser.manufacturer) || (data.lcsc && data.lcsc.brandName) || '',
        level1: data.level1 || '',
        level2: data.level2 || '',
        chipName: data.level2 || '',
        description: (data.digikey && data.digikey.description) || (data.mouser && data.mouser.description) || (data.lcsc && data.lcsc.description) || ''
      });
    } catch (e) {
      results.push({
        original: pn,
        shouldCost: '',
        digikeyPart: '未查询到',
        digikey1k: '未查询到',
        mouserPart: '未查询到',
        mouser1k: '未查询到',
        lcscPart: '未查询到',
        lcsc1k: '未查询到',
        manufacturer: '',
        level1: '',
        level2: '',
        chipName: '',
        description: ''
      });
    }

    const pct = Math.round(((i + 1) / total) * 100);
    progressFill.style.width = pct + '%';
    progressFill.textContent = pct + '%';

    if (i < list.length - 1) {
      await new Promise(r => setTimeout(r, QUERY_INTERVAL_MS));
    }
  }

  progressText.textContent = '正在生成结果文件...';

  // ★ 严格按照你要求的顺序构建 Excel 表头
  const outputData = [
    ['原始型号', 'Should Cost（CNY）', 'Digikey完整型号', 'Digikey单价-1k pcs（USD）', 'Mouser完整型号', 'Mouser单价-1k pcs（USD）', '立创完整型号', '立创单价-1k pcs（USD）', '芯片品牌/厂商', '芯片一级分类', '芯片二级分类', '芯片名称', '描述']
  ];
  
  results.forEach(r => {
    outputData.push([
      r.original, 
      r.shouldCost, 
      r.digikeyPart, r.digikey1k, 
      r.mouserPart, r.mouser1k, 
      r.lcscPart, r.lcsc1k,
      r.manufacturer, r.level1, r.level2, r.chipName, r.description
    ]);
  });

  const newSheet = XLSX.utils.aoa_to_sheet(outputData);
  
  // 调整列宽，让文本显示完整
  newSheet['!cols'] = [
    { wch: 22 }, { wch: 20 }, 
    { wch: 26 }, { wch: 25 }, 
    { wch: 26 }, { wch: 25 }, 
    { wch: 26 }, { wch: 25 }, 
    { wch: 26 }, { wch: 24 }, { wch: 32 }, { wch: 32 }, { wch: 50 }
  ];

  const newWorkbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(newWorkbook, newSheet, '分析结果');

  const outFileName = file.name.replace(/\.(xlsx|xls)$/i, '') + '_分析结果.xlsx';
  const wbout = XLSX.write(newWorkbook, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);

  resultDiv.innerHTML = `
    <div class="success-msg">
      ✅ <strong>批量分析完成！</strong>共分析 ${total} 个型号。<br>
      结果文件已自动开始下载，如未开始，请点击下方按钮：
    </div>
    <div style="text-align:center;">
      <a href="${url}" download="${outFileName}" 
         style="display:inline-block;padding:14px 32px;background:#27ae60;color:#fff;text-decoration:none;border-radius:12px;font-weight:bold;">
        📥 下载分析结果
      </a>
    </div>
  `;

  const a = document.createElement('a');
  a.href = url;
  a.download = outFileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

document.getElementById('batchModal').addEventListener('click', function(e) {
  if (e.target === this) closeBatchModal();
});
</script>
</body>
</html>
