<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>芯片成本查询 - ChipCost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .container {
    width: 100%;
    max-width: 700px;
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    height: fit-content;
  }
  h1 { font-size: 26px; text-align: center; margin-bottom: 10px; color: #2c3e50; }
  .subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }
  .search-box { display: flex; gap: 12px; }
  input {
    flex: 1;
    padding: 14px 20px;
    font-size: 16px;
    border: 2px solid #e0e6ed;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.3s;
  }
  input:focus { border-color: #3498db; }
  button {
    padding: 14px 32px;
    font-size: 16px;
    background: #3498db;
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.3s;
    font-weight: bold;
  }
  button:hover { background: #2980b9; }
  button:disabled { background: #bdc3c7; cursor: not-allowed; }
  #result { margin-top: 30px; }
  .loading { text-align: center; color: #7f8c8d; padding: 30px; }
  .error {
    color: #e74c3c;
    background: #fdf0ed;
    padding: 20px;
    border-radius: 12px;
    border-left: 4px solid #e74c3c;
  }
  .card {
    border: 1px solid #e0e6ed;
    border-radius: 12px;
    padding: 24px;
    animation: fadeIn 0.3s ease-in;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #f1f4f8;
    font-size: 15px;
  }
  .row:last-child { border-bottom: none; }
  .label { color: #7f8c8d; }
  .value { font-weight: 500; color: #2c3e50; text-align: right; max-width: 60%; }
  .price-highlight {
    text-align: center;
    padding: 24px 0;
    background: #f8f9fa;
    border-radius: 12px;
    margin: 20px 0;
  }
  .price-big {
    font-size: 36px;
    color: #e74c3c;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .price-note { color: #7f8c8d; font-size: 14px; }
  table { width: 100%; margin-top: 20px; border-collapse: collapse; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f1f4f8; font-size: 14px; }
  th { background: #f8f9fa; color: #7f8c8d; font-weight: 500; border-radius: 8px 8px 0 0; }
  .detail-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #3498db;
    text-decoration: none;
    font-size: 14px;
  }
  .detail-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>芯片成本查询</h1>
  <p class="subtitle">输入芯片型号，查询参考价格</p>
  <div class="search-box">
    <input type="text" id="partInput" placeholder="例如：STM32F103C8T6" />
    <button id="queryBtn" onclick="query()">查询</button>
  </div>
  <div id="result"></div>
</div>

<script>
const API_URL = 'https://chipcost.space';

document.getElementById('partInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') query();
});

async function query() {
  const input = document.getElementById('partInput');
  const btn = document.getElementById('queryBtn');
  const resultDiv = document.getElementById('result');
  const partNumber = input.value.trim();

  if (!partNumber) {
    resultDiv.innerHTML = '<div class="error">请输入芯片型号</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = '查询中...';
  resultDiv.innerHTML = '<div class="loading">正在查询云端价格...</div>';

  try {
    const resp = await fetch(API_URL + '?partNumber=' + encodeURIComponent(partNumber));
    const data = await resp.json();

    if (!resp.ok) {
      resultDiv.innerHTML = '<div class="error">' + (data.error || '查询失败') + '</div>';
      return;
    }

    // 核心逻辑：计算1000片起订价格（向下取最近的价格阶梯）
    const breaks = (data.priceBreaks || []).slice().sort(
      (a, b) => parseInt(a.Quantity) - parseInt(b.Quantity)
    );

    let selected = null;
    for (const pb of breaks) {
      if (parseInt(pb.Quantity) <= 1000) selected = pb;
      else break;
    }
    if (!selected && breaks.length > 0) selected = breaks[0];

    let html = '<div class="card">';
    html += '<div class="row"><span class="label">厂商料号</span><span class="value">' + (data.partNumber || '-') + '</span></div>';
    html += '<div class="row"><span class="label">制造商</span><span class="value">' + (data.manufacturer || '-') + '</span></div>';
    html += '<div class="row"><span class="label">描述</span><span class="value">' + (data.description || '-') + '</span></div>';

    if (selected) {
      html += '<div class="price-highlight">';
      html += '<div class="price-big">' + selected.Price + ' ' + selected.Currency + '</div>';
      html += '<div class="price-note">对应起订量 ' + selected.Quantity + ' 片（当前参考价）</div>';
      html += '</div>';
    } else {
      html += '<div class="price-note">该型号暂无价格信息</div>';
    }

    if (breaks.length > 0) {
      html += '<table><tr><th>起订量</th><th>单价</th></tr>';
      breaks.forEach(pb => {
        html += '<tr><td>' + pb.Quantity + '</td><td>' + pb.Price + ' ' + (pb.Currency || '') + '</td></tr>';
      });
      html += '</table>';
    }

    if (data.detailUrl) {
      html += '<a class="detail-link" href="' + data.detailUrl + '" target="_blank">查看贸泽详情页 →</a>';
    }

    html += '</div>';
    resultDiv.innerHTML = html;

  } catch (e) {
    resultDiv.innerHTML = '<div class="error">无法连接到后端服务，请稍后重试</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = '查询';
  }
}
</script>
</body>
</html>
